<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Problem Difficulty Prediction</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            background-color: #f2f4f7;
            padding: 40px;
        }

        .container {
            max-width: 700px;
            margin: auto;
            background: #ffffff;
            padding: 30px;
            border-radius: 10px;
            box-shadow: 0 8px 20px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            color: #333;
        }

        label {
            font-weight: bold;
            display: block;
            margin-top: 20px;
        }

        textarea {
            width: 100%;
            height: 120px;
            padding: 10px;
            margin-top: 6px;
            border-radius: 6px;
            border: 1px solid #ccc;
            font-size: 14px;
            resize: vertical;
        }

        button {
            width: 100%;
            margin-top: 25px;
            padding: 12px;
            font-size: 16px;
            background-color: #007bff;
            color: #fff;
            border: none;
            border-radius: 6px;
            cursor: pointer;
        }

        button:hover {
            background-color: #0056b3;
        }

        .result {
            margin-top: 30px;
            padding: 20px;
            background: #e8f4ff;
            border-left: 5px solid #007bff;
        }
    </style>
</head>

<body>
<div class="container">
    <h1>Problem Difficulty Predictor</h1>

    <form action="/predict" method="POST">

        <label for="problem_description">Problem Description</label>
        <textarea name="problem_description" required></textarea>

        <label for="input_description">Input Description</label>
        <textarea name="input_description" required></textarea>

        <label for="output_description">Output Description</label>
        <textarea name="output_description" required></textarea>

        <button type="submit">Predict</button>
    </form>

    {% if predicted_class is defined %}
    <div class="result">
        <h3>Prediction Result</h3>
        <p><strong>Predicted Class:</strong> {{ predicted_class }}</p>
        <p><strong>Predicted Score:</strong> {{ predicted_score }}</p>
    </div>
    {% endif %}
</div>
</body>
</html>
